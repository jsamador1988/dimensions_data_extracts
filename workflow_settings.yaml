defaultProject: dimensionsdataextracts
defaultDataset: rd_stage
defaultAssertionDataset: rd_assert
defaultLocation: US
dataformCoreVersion: 3.0.37

vars:
  sample_start: "1950-01-01"
  sample_end: "2024-12-31"
  breakthrough_window_years: "5"
  journal_elig_min_articles: "1000"
  top_journal_pct: "0.05"
  breakthrough_min_cell_pubs: "100"
  min_for4_overlap: "0"
  min_jaccard: "0.0"
  grant_match_window_years: "15"
  # ------------------------------------------------------------
  # Tier-3 fuzzy hardening (institution matching)
  # ------------------------------------------------------------
  inst_fuzzy_max_concepts_grant: "20"
  inst_fuzzy_max_concepts_pub: "20"
  inst_fuzzy_max_concepts_patent: "20"

  inst_fuzzy_min_concept_jaccard: "0.02"
  inst_fuzzy_min_title_jaccard: "0.10"

  # When FoR Jaccard fails or FoR is missing, allow concept overlap to override (safer than title-only).
  inst_fuzzy_min_concept_jaccard_nofield: "0.02"
  inst_fuzzy_min_concept_overlap_nofield: "1"

  # keep only top-K scored grant matches per output (performance guardrail)
  inst_fuzzy_topk: "5"

  # max candidate pairs per pub/patent before concept/title scoring (performance guardrail)
  inst_max_candidates_per_pub: "100"

  # title tokenization
  inst_fuzzy_min_title_token_len: "3"

  # --- Enhanced fuzzy scoring (abstract Jaccard blend) ---
  inst_fuzzy_base_weight: "0.7"
  inst_fuzzy_abstract_weight: "0.3"
  inst_fuzzy_max_abstract_tokens: "300"

  # --- Tier 2 RID Top-K filtering ---
  rid_topk: "5"

  # ------------------------------------------------------------
  # Patent-specific overrides (stricter than shared pub params)
  # Patents have higher false positive rates from institution matching,
  # so they need the FoR gate and stricter concept/title thresholds.
  # See grant_calibration/outputs/CALIBRATION_REPORT.md for justification.
  # ------------------------------------------------------------
  pat_min_for4_overlap: "1"
  pat_min_jaccard: "0.2"
  pat_inst_fuzzy_min_concept_jaccard: "0.10"
  pat_inst_fuzzy_min_title_jaccard: "0.20"
  pat_inst_fuzzy_min_concept_jaccard_nofield: "0.05"
  pat_inst_fuzzy_min_concept_overlap_nofield: "2"

  # --- Stage-level options (not matching parameters) ---
  ipcr_prefix_len: "0"
  pub_allow_year_only_dates: "false"
