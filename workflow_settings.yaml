defaultProject: dimensionsdataextracts
defaultDataset: rd_stage
defaultAssertionDataset: dataform_assertions
defaultLocation: US
dataformCoreVersion: 3.0.37

vars:
  sample_start: "1950-01-01"
  sample_end: "2024-12-31"
  breakthrough_window_years: "5"
  journal_elig_min_articles: "1000"
  top_journal_pct: "0.05"
  min_for4_overlap: "1"
  min_jaccard: "0.5"
  grant_match_window_years: "10"
  # ------------------------------------------------------------
  # Tier-3 fuzzy hardening (institution matching)
  # ------------------------------------------------------------
  inst_fuzzy_max_concepts_grant: "20"
  inst_fuzzy_max_concepts_pub: "20"
  inst_fuzzy_max_concepts_patent: "20"

  inst_fuzzy_min_concept_jaccard: "0.10"
  inst_fuzzy_min_title_jaccard: "0.20"

  # When FoR Jaccard fails or FoR is missing, allow concept overlap to override (safer than title-only).
  inst_fuzzy_min_concept_jaccard_nofield: "0.05"
  inst_fuzzy_min_concept_overlap_nofield: "2"

  # keep only top-K scored grant matches per output (performance guardrail)
  inst_fuzzy_topk: "3"

  # max candidate pairs per pub/patent before concept/title scoring (performance guardrail)
  inst_max_candidates_per_pub: "100"

  # title tokenization
  inst_fuzzy_min_title_token_len: "3"
