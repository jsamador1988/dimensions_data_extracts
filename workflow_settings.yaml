defaultProject: dimensionsdataextracts
defaultDataset: rd_stage
defaultAssertionDataset: dataform_assertions
defaultLocation: "US"
dataformCoreVersion: "3.0.37"

vars:
  sample_start: "1950-01-01"
  sample_end: "2024-12-31"

  # publications
  breakthrough_window_years: "5"
  journal_elig_min_articles: "1000"
  top_journal_pct: "0.05"
  journal_rank_pre_start: "2000-01-01"
  journal_rank_pre_end: "2015-12-31"

  # tier2 matching (patents ↔ grants)
  min_for4_overlap: "1"
  min_jaccard: "0.50"
  max_grant_to_patent_years: "10"
